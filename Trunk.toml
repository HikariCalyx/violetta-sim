# Build settings that Trunk takes from here rather than from the defaults.
#
# The release build is post-processed with wasm-opt, and Trunk's default is
# binaryen 105 — which predates the way wasm-bindgen 0.2.129 lays out its
# externref table. binaryen 105 rewrites that table to a *fixed* size, so the
# `table.grow(4)` wasm-bindgen does at startup fails with
# "WebAssembly.Table.grow(): failed to grow table by 4" and the app never gets
# past its loading screen. Pinning a current binaryen keeps the table growable.
[tools]
wasm_opt = "version_119"
