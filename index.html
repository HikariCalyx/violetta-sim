<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Violetta Lie Detector Simulator</title>

    <!-- Build the Rust crate in ./violetta_lie_detector_sim into a wasm module. -->
    <link data-trunk rel="rust" href="violetta_lie_detector_sim/Cargo.toml" />
    <!-- Base URL that other asset URLs are built from; filled in by trunk. -->
    <base data-trunk-public-url />

    <style>
        html,
        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1b1b1f;
            touch-action: manipulation;
        }

        /* Let the canvas (egui's render surface) fill the whole page. */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-family: system-ui, sans-serif;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- The id is hardcoded in src/main.rs, so make sure both match. -->
    <canvas id="the_canvas_id"></canvas>

    <!-- Removed from the DOM by src/main.rs once the app has started. -->
    <div id="loading_text">
        <noscript>This app requires JavaScript to be enabled.</noscript>
        <p>Loading…</p>
    </div>
</body>
</html>
